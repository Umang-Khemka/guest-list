<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wedding Desk</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f5f3;
        --sf: #fff;
        --ink: #17302d;
        --mu: #667873;
        --ln: #dde5e1;
        --pr: #14504a;
        --pr2: #e1eeeb;
        --gd: #c98a1b;
        --gd2: #fbf0d9;
        --ro: #a8374f;
        --ro2: #f8e3e8;
        --r: 14px;
        --hf: "Fraunces", Georgia, serif;
        --bf: "DM Sans", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font: 15px/1.45 var(--bf);
        background: var(--bg);
        color: var(--ink);
        padding-bottom: 70px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3 {
        font-family: var(--hf);
        font-weight: 700;
      }
      h1 {
        font-size: 26px;
        margin-bottom: 4px;
      }
      h2 {
        font-size: 19px;
        margin: 20px 0 10px;
      }
      h3 {
        font-size: 16px;
      }
      .side {
        display: none;
      }
      nav.bot {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        background: var(--sf);
        border-top: 1px solid var(--ln);
        z-index: 20;
        padding-bottom: env(safe-area-inset-bottom);
      }
      nav button {
        flex: 1;
        border: 0;
        background: none;
        padding: 11px 0;
        font-size: 11px;
        color: var(--mu);
      }
      nav button.on {
        color: var(--pr);
        font-weight: 700;
        box-shadow: inset 0 3px var(--gd);
      }
      main {
        padding: 18px 14px;
        max-width: 1100px;
        margin: auto;
      }
      .sub {
        color: var(--mu);
        margin-bottom: 14px;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, 1fr);
      }
      .cards {
        display: grid;
        gap: 12px;
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: var(--r);
        padding: 14px;
      }
      .stat b {
        font: 700 28px var(--hf);
        display: block;
        color: var(--pr);
      }
      .stat span {
        color: var(--mu);
        font-size: 13px;
      }
      .stat.hot b {
        color: var(--ro);
      }
      .btn {
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 10px;
        padding: 9px 13px;
        cursor: pointer;
        font-weight: 500;
        text-decoration: none;
        display: inline-block;
        font-size: 14px;
      }
      a.btn {
        color: var(--ink);
      }
      .btn.p {
        background: var(--pr);
        color: #fff;
        border-color: var(--pr);
      }
      .btn.s {
        padding: 6px 10px;
        font-size: 13px;
      }
      .btn:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--gd);
        outline-offset: 1px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .sp {
        justify-content: space-between;
      }
      .pill {
        font-size: 12px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 99px;
        background: var(--pr2);
        color: var(--pr);
      }
      .pill.Pending,
      .pill.pend {
        background: var(--gd2);
        color: #8a5d0b;
      }
      .pill.Declined,
      .pill.fail {
        background: var(--ro2);
        color: var(--ro);
      }
      .mu {
        color: var(--mu);
        font-size: 13px;
      }
      .bar {
        height: 8px;
        background: var(--ln);
        border-radius: 9px;
        overflow: hidden;
        margin-top: 8px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--pr);
      }
      .tools {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
        margin-bottom: 14px;
      }
      .tools input {
        grid-column: 1/-1;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--ln);
        border-radius: 10px;
        background: var(--sf);
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--mu);
        margin: 10px 0 4px;
      }
      .fam {
        border-left: 4px solid var(--pr);
      }
      .fam.Pending {
        border-color: var(--gd);
      }
      .fam.Declined {
        border-color: var(--ro);
      }
      .acts {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-top: 12px;
      }
      .acts .btn {
        padding: 8px 0;
        text-align: center;
        font-size: 13px;
      }
      .kv {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 4px 10px;
        font-size: 14px;
      }
      .kv dt {
        color: var(--mu);
      }
      .kv dd {
        margin: 0;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: #0a1a1880;
        z-index: 50;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .md {
        background: var(--bg);
        width: 100%;
        max-height: 92vh;
        overflow: auto;
        border-radius: 20px 20px 0 0;
        padding: 18px 16px 26px;
        max-width: 640px;
      }
      .chip {
        display: inline-block;
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 99px;
        padding: 6px 12px;
        margin: 0 6px 6px 0;
        cursor: pointer;
        font-size: 13px;
      }
      .chip.on {
        background: var(--pr);
        color: #fff;
        border-color: var(--pr);
      }
      .send {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .send .chip {
        border-radius: 12px;
        padding: 12px;
        margin: 0;
      }
      .wa {
        background: #e5ddd5;
        border-radius: var(--r);
        padding: 16px;
      }
      .bub {
        background: #dcf8c6;
        border-radius: 4px 14px 14px 14px;
        padding: 10px 12px;
        white-space: pre-wrap;
        max-width: 92%;
        box-shadow: 0 1px 1px #0002;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .rl {
        max-height: 190px;
        overflow: auto;
        border: 1px solid var(--ln);
        border-radius: 10px;
        background: var(--sf);
        margin-top: 6px;
      }
      .rl label {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 0;
        padding: 9px 10px;
        color: var(--ink);
        font-size: 14px;
        border-bottom: 1px solid var(--ln);
      }
      .rl input {
        width: auto;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 84px;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 11px 18px;
        border-radius: 12px;
        z-index: 99;
        opacity: 0;
        transition: 0.25s;
        pointer-events: none;
        max-width: 90%;
      }
      #toast.on {
        opacity: 1;
      }
      #toast.err {
        background: var(--ro);
      }
      @media (min-width: 900px) {
        body {
          padding: 0 0 0 230px;
        }
        nav.bot {
          display: none;
        }
        .side {
          display: flex;
          flex-direction: column;
          position: fixed;
          inset: 0 auto 0 0;
          width: 230px;
          background: var(--pr);
          color: #fff;
          padding: 26px 14px;
        }
        .side h2 {
          color: #fff;
          margin: 0 8px 2px;
          font-size: 22px;
        }
        .side p {
          margin: 0 8px 24px;
          color: #b9d3cf;
          font-size: 13px;
        }
        .side button {
          display: block;
          width: 100%;
          text-align: left;
          background: none;
          border: 0;
          color: #cfe3df;
          padding: 11px 12px;
          border-radius: 10px;
          cursor: pointer;
          margin-bottom: 2px;
        }
        .side button.on {
          background: #ffffff1c;
          color: #fff;
          font-weight: 700;
          box-shadow: inset 3px 0 var(--gd);
        }
        main {
          padding: 34px 36px;
        }
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
        .tools {
          grid-template-columns: 2fr repeat(5, 1fr);
        }
        .tools input {
          grid-column: auto;
        }
        .ov {
          align-items: center;
        }
        .md {
          border-radius: 20px;
          padding: 24px;
        }
        #toast {
          bottom: 30px;
        }
        .two {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
          align-items: start;
        }
      }
    </style>
  </head>

          rno,
        )}</select><label>People staying</label><input id="a_p" type="number" min="1" value="2">
<div class="row" style="margin-top:16px"><button class="btn p" onclick="saveAlloc()">Allocate room</button><button class="btn" onclick="closeM()">Cancel</button></div>`);
      }
      function saveAlloc() {
        const r = +$("#a_r").value,
          p = +$("#a_p").value,
          room = R.find((x) => x.no == r),
          used = A.filter((a) => a.room == r).reduce((s, a) => s + a.people, 0);
        if (used + p > room.cap)
          return toast(`Room ${r} sleeps ${room.cap}, ${used} already in`, 1);
        A.push({ id: Date.now(), fam: +$("#a_f").value, room: r, people: p });
        closeM();
        render();
        toast("Room allocated");
      }
      function rmAllocD(id, fid) {
        A = A.filter((a) => a.id != id);
        render();
        detail(fid);
        toast("Room removed");
      }
      function rmAlloc(id) {
        A = A.filter((a) => a.id != id);
        render();
        toast("Allocation removed");
      }
      function assignM(fid, vid) {
        const f = fid && fam(fid),
          t = f && f.travel && f.travel.a;
        modal(`<h2 style="margin-top:0">Assign a car</h2><label>Family</label><select id="x_f">${opts(
          F.map((f) => [f.id, fname(f)]),
          fid,
        )}</select><label>Car</label><select id="x_v">${opts(
          V.map((v) => [v.id, `${v.name} · ${v.driver}`]),
          vid,
        )}</select><label>Pickup or drop</label><select id="x_t">${opts(["Pickup", "Drop"])}</select>
<label>Date</label><input id="x_d" value="${t ? t.d : TODAY}"><label>Time</label><input id="x_h" value="${t ? t.t : "3:30 PM"}"><label>Place</label><input id="x_l" value="${t ? t.l : ""}" placeholder="Airport, station or hotel">
<div class="row" style="margin-top:16px"><button class="btn p" onclick="saveAssign()">Assign car</button><button class="btn" onclick="closeM()">Cancel</button></div>`);
      }
      function saveAssign() {
        const x = {
          id: Date.now(),
          fam: +$("#x_f").value,
          veh: +$("#x_v").value,
          type: $("#x_t").value,
          date: $("#x_d").value,
          time: $("#x_h").value,
          loc: $("#x_l").value,
        };
        const c = X.find(
          (y) => y.veh == x.veh && y.date == x.date && y.time == x.time,
        );
        if (c)
          return toast(
            `${veh(x.veh).name} is already booked then for ${fname(fam(c.fam))}`,
            1,
          );
        X.push(x);
        closeM();
        render();
        toast("Car assigned");
      }
      function rmAssign(id) {
        X = X.filter((x) => x.id != id);
        render();
        toast("Assignment removed");
      }
      function roomM() {
        modal(
          `<h2 style="margin-top:0">Add room</h2><label>Room number</label><input id="r_n" type="number"><label>Type</label><select id="r_t">${opts(["Standard", "Deluxe", "Suite"])}</select><label>Capacity</label><input id="r_c" type="number" value="2"><div class="row" style="margin-top:16px"><button class="btn p" onclick="saveRoom()">Save room</button><button class="btn" onclick="closeM()">Cancel</button></div>`,
        );
      }
      function saveRoom() {
        const n = +$("#r_n").value;
        if (!n || R.some((r) => r.no == n))
          return toast("Enter a new room number", 1);
        R.push({
          no: n,
          type: $("#r_t").value,
          cap: +$("#r_c").value || 2,
          notes: "",
        });
        closeM();
        render();
        toast("Room added");
      }
      function vehM() {
        modal(
          `<h2 style="margin-top:0">Add vehicle</h2><label>Name</label><input id="v_n" placeholder="Innova 3"><label>Vehicle number</label><input id="v_no"><label>Driver name</label><input id="v_d"><label>Driver phone</label><input id="v_p" value="+91 "><label>Seats</label><input id="v_c" type="number" value="4"><div class="row" style="margin-top:16px"><button class="btn p" onclick="saveVeh()">Save vehicle</button><button class="btn" onclick="closeM()">Cancel</button></div>`,
        );
      }
      function saveVeh() {
        if (!$("#v_n").value) return toast("Give the vehicle a name", 1);
        V.push({
          id: V.length + 1,
          name: $("#v_n").value,
          no: $("#v_no").value,
          driver: $("#v_d").value,
          dphone: $("#v_p").value,
          cap: +$("#v_c").value || 4,
          notes: "",
        });
        closeM();
        render();
        toast("Vehicle added");
      }
      render();
    </script>
  </body>
</html>
